name: Build and release vaSys plugin

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional tag name to release
        required: false
        default: ""
  push:
    branches:
      - master
      - vatnz/main
    tags:
      - "v*"
      - "V*"
      - "[0-9]*"
  pull_request:
    branches:
      - master
      - vatnz/main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve release metadata
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ github.event.inputs.tag_name }}")) {
            $tag = "${{ github.event.inputs.tag_name }}"
          }

          $isRelease = "${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true" -or -not [string]::IsNullOrWhiteSpace("${{ github.event.inputs.tag_name }}")
          $fileVersion = $tag -replace '^[vV]', ''
          if ($fileVersion -notmatch '^\d+(\.\d+){0,3}$') {
            $fileVersion = '0.9.2'
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

      - name: Download and extract vatSys
        id: vatsys
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'vatSysSetup.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'vatsys-installer'
          $target = Join-Path $env:RUNNER_TEMP 'vatsys-admin'

          Invoke-WebRequest -Uri 'https://vatsys.sawbe.com/downloads/vatSysSetup.zip' -OutFile $zip
          New-Item -ItemType Directory -Force -Path $extract, $target | Out-Null
          7z x $zip "-o$extract" -y

          $msi = Get-ChildItem -Path $extract -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) {
            throw 'vatSysSetup.msi was not found in the downloaded zip.'
          }

          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msi.FullName, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "vatSys administrative install failed with exit code $($process.ExitCode)."
          }

          $exe = Get-ChildItem -Path $target -Recurse -Filter 'vatSys.exe' | Select-Object -First 1
          if (-not $exe) {
            throw 'vatSys.exe was not found after administrative install.'
          }

          $vatSysDir = Split-Path (Split-Path $exe.FullName -Parent) -Parent
          "vat_sys_dir=$vatSysDir" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: msbuild .\ozstrips.sln /t:Restore /p:VatSysDir="${{ steps.vatsys.outputs.vat_sys_dir }}" /p:RestoreIgnoreFailedSources=true /v:minimal

      - name: Build
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP 'OzStrips-VATNZ'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          msbuild .\GUI\GUI.csproj /p:Configuration=Release /p:TargetFrameworks=net481 /p:VatSysDir="${{ steps.vatsys.outputs.vat_sys_dir }}" /p:OutDir="$outDir\" /p:FileVersion=${{ steps.vars.outputs.file_version }} /m /v:minimal
          "out_dir=$outDir" >> $env:GITHUB_OUTPUT
        id: build

      - name: Package
        if: steps.vars.outputs.is_release == 'true'
        id: package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "OzStrips-VATNZ-${{ steps.vars.outputs.tag }}.zip"
          Compress-Archive -Path (Join-Path '${{ steps.build.outputs.out_dir }}' '*') -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.vars.outputs.is_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.vars.outputs.tag }}
          name: "OzStrips VATNZ ${{ steps.vars.outputs.tag }}"
          artifacts: ${{ steps.package.outputs.zip }}
          allowUpdates: true
          replacesArtifacts: true
          body: |
            VATNZ/New Zealand OzStrips build for vaSys.

            Install by extracting the zip into:

            `C:\Users\<YourName>\Documents\vatSys Files\Profiles\New Zealand\Plugins\OzStrips`